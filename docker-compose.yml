# Orchestratore LLM (prototipo standalone) + stub di Blocco 1 per sviluppo/demo
# Avvio: cp .env.example .env && docker compose up --build -d
# Chat WebSocket: ws://localhost:${ORCHESTRATOR_PORT:-5000}/ws/chat

name: food-production-orchestrator

services:
  orchestratore:
    build: .
    image: food-production-orchestrator:latest
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: "5000"
      BLOCK1_BASE_URL: ${BLOCK1_BASE_URL:-http://block1-stub:7000}
    ports:
      - "${ORCHESTRATOR_PORT:-5000}:5000"
    depends_on:
      block1-stub:
        condition: service_healthy
    networks:
      - internal

  # Stub del microservizio analitico (dev/block1_stub.py). Per usare un Blocco 1
  # reale impostare BLOCK1_BASE_URL in .env (lo stub resta comunque avviato).
  block1-stub:
    build: .
    image: food-production-orchestrator:latest
    restart: unless-stopped
    command: ["uvicorn", "block1_stub:app", "--app-dir", "dev", "--host", "0.0.0.0", "--port", "7000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:7000/docs', timeout=4).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - internal

networks:
  internal:
    driver: bridge
